name: Update stocks data

# Refreshes stocks-data.json (the website's embedded dashboard data) on
# weekday afternoons after the US market close. Commits only when values change.
# Manual runs: Actions tab -> "Update stocks data" -> Run workflow.

on:
  schedule:
    # 22:05 UTC = 17:05 EST (18:05 EDT in summer), Mon-Fri
    - cron: '5 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh stocks-data.json
        run: python3 update-stocks-data.py

      - name: Commit and push if changed
        run: |
          git config user.name "stocks-bot"
          git config user.email "stocks-bot@users.noreply.github.com"
          git add stocks-data.json
          git diff --cached --quiet || git commit -m "Update stocks data (automated)"
          git push
