name: Update stocks data

# Refreshes the website's embedded dashboard data (stocks-data.json,
# stocks-graph.json, stocks-fundamental.json, stocks-earnings.json) on
# weekday evenings after the US market close. Commits only when values change.
# Manual runs: Actions tab -> "Update stocks data" -> Run workflow.

on:
  schedule:
    # 00:05 UTC = 19:05 EST (20:05 EDT in summer), Tue-Sat UTC = Mon-Fri ET.
    # Moved later from 22:05 UTC on Nov 11, 2026 so Stooq has published the
    # day's closes before the run (Nov 10 run missed the close at 17:05 EST).
    - cron: '5 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh stocks data
        run: python3 update-stocks-data.py

      - name: Commit and push if changed
        run: |
          git config user.name "stocks-bot"
          git config user.email "stocks-bot@users.noreply.github.com"
          git add stocks-data.json stocks-graph.json stocks-fundamental.json stocks-earnings.json
          git diff --cached --quiet || git commit -m "Update stocks data (automated)"
          git push
